buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// روش استاندارد و بدون کرش برای یکپارچه‌سازی تمام پلاگین‌ها (از جمله gal) روی SDK 35
subprojects { project ->
    project.afterEvaluate {
        def androidExtension = project.extensions.findByName("android")
        if (androidExtension != null) {
            if (androidExtension.hasProperty("compileSdkVersion")) {
                androidExtension.compileSdkVersion = 35
            }
            if (androidExtension.hasProperty("buildToolsVersion")) {
                androidExtension.buildToolsVersion = "35.0.0"
            }
        }
    }
}
