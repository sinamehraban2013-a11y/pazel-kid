name: Build Web (Eitaa Mini-App)

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'  # هر روز ۰۲:۳۰ UTC (حدود ۶:۰۰ صبح تهران)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Create web platform files
        run: flutter create . --org com.example --project-name puzzle_kids_game --platforms=web

      - name: Add Eitaa SDK to index.html
        run: |
          python3 - <<'PY'
          p = 'web/index.html'
          c = open(p, encoding='utf-8').read()
          sdk = ('<script src="https://developer.eitaa.com/eitaa-web-app.js"></script>\n'
                 '  <script>try{var w=window.Eitaa&&window.Eitaa.WebApp;if(w){w.ready();w.expand();}}catch(e){}</script>\n')
          c = c.replace('<head>', '<head>\n  ' + sdk, 1)
          sdk2 = ('<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">\n'
                  '  <style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;direction:ltr}</style>\n')
          c = c.replace('<head>', '<head>\n  ' + sdk2, 1)
          c = c.replace('<html>', '<html lang="fa">', 1)
          open(p, 'w', encoding='utf-8').write(c)
          PY

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /pazel-kid/

      - name: Bundle audio and images from Google Drive
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request as u
          API = "https://script.google.com/macros/s/AKfycbwBLyDbJu78M_nxaZtfcfFtd6DSMp6yl3Lu2lPOPwimuDynqGN8cTvZr4JpN3eJhxGA/exec?folderId="
          JOBS = [
            ("audio",  "1tFPotXvU0NxyR8Jqsh8SPI3DZakKps08", (".mp3", ".m4a", ".wav", ".ogg"), 5),
            ("images", "1CHlj2vLFuc-JjHAKREjcQ-YfZVO3ueBh", (".jpg", ".jpeg", ".png", ".webp"), 5),
          ]
          MAX_TOTAL = 400 * 1024 * 1024
          total = 0
          for folder, fid, exts, min_count in JOBS:
              items = json.load(u.urlopen(API + fid, timeout=90))
              os.makedirs("build/web/" + folder, exist_ok=True)
              names = []
              for i, f in enumerate(items):
                  n = f.get("name", "").lower()
                  if not n.endswith(exts):
                      continue
                  ext = os.path.splitext(n)[1]
                  out = "f%d%s" % (i, ext)
                  url = "https://drive.usercontent.google.com/download?id=%s&export=download&confirm=t" % f["id"]
                  for t in range(3):
                      try:
                          data = u.urlopen(url, timeout=180).read()
                          if len(data) > 5000 and not data.lstrip().startswith(b"<"):
                              open("build/web/%s/%s" % (folder, out), "wb").write(data)
                              total += len(data)
                              names.append(out)
                              break
                          print("bad data", out, len(data))
                      except Exception as e:
                          print("retry", out, e)
                      time.sleep(3)
              print(folder, len(names), "files")
              assert len(names) >= min_count, "too few files in " + folder + " - build stopped"
              json.dump(names, open("build/web/%s/list.json" % folder, "w"))
          print("total MB:", total // 1048576)
          assert total <= MAX_TOTAL, "media too large - build stopped"
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
