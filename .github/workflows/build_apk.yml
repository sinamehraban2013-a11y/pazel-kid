name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Fix Android SDK Platforms
        run: |
          rm -rf /usr/local/lib/android/sdk/platforms/android-35 || true

      - name: Recreate Clean Android Structure
        run: |
          rm -rf android
          flutter create . --org com.example --project-name puzzle_kids_game --platforms=android

      - name: Add Internet Permission to Manifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
