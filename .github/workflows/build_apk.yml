name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Structure
        run: |
          rm -rf android
          flutter create . --org com.example --project-name puzzle_kids_game --platforms=android

      - name: Configure Android SDK Versions & Permissions
        run: |
          # 1. افزودن مجوز اینترنت به مانیفست
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # 2. تنظیم نام نمایشی برنامه به جورچین
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('android:label=\"puzzle_kids_game\"', 'android:label=\"جورچین\"')
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          "
          
          # 3. تنظیم compileSdk به 35 و minSdk به 23 جهت سازگاری کامل پکیج‌ها (مثل gal)
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
